<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matériel Soudure - Nos Réseaux Sociaux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #fff;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(223, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            margin-bottom: 20px;
        }

        h1 {
            color: #000;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #DF0000;
            font-size: 18px;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-link {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            text-decoration: none;
            color: #000;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(223, 0, 0, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            border-color: #DF0000;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(223, 0, 0, 0.2);
        }

        .social-icon {
            width: 32px;
            height: 32px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .social-text {
            flex-grow: 1;
            text-align: left;
        }

        .social-handle {
            color: #666;
            font-size: 14px;
            font-weight: 400;
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .footer-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .highlight {
            color: #DF0000;
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-link {
            animation: fadeIn 0.6s ease backwards;
        }

        .social-link:nth-child(1) { animation-delay: 0.1s; }
        .social-link:nth-child(2) { animation-delay: 0.2s; }
        .social-link:nth-child(3) { animation-delay: 0.3s; }
        .social-link:nth-child(4) { animation-delay: 0.4s; }
        .social-link:nth-child(5) { animation-delay: 0.5s; }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 26px;
            }

            .subtitle {
                font-size: 16px;
            }

            .social-link {
                padding: 16px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
